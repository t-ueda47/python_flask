<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask UI演習</title>
    <!-- 1. Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- 2. Bootswatch (Minty) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
</head>

<body>
    <!-- container で画面の中央に配置＆余白をつける -->
    <!-- mt-5 は Margin-Top: 5（上の余白）を意味します -->
    <div class="container mt-5">
        <!-- alert（通知枠） -->
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>ログイン成功！</strong> Bootstrapが正しく読み込まれています。
            <!-- × ボタン（JSで消える動作） -->
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <h1>Flaskアプリへようこそ</h1>

        <!-- card（カード型の枠）の中にフォームを入れる -->
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0">ユーザー登録</h2>
            </div>
            <div class="card-body">

                <!-- フォーム領域 -->
                <form class="mt-4">
                    <div class="mb-3">
                        <label for="username" class="form-label">ユーザー名</label>
                        <!-- form-control をつけるだけで入力欄がきれいに整う -->
                        <input type="text" class="form-control" id="username" placeholder="山田 太郎">
                    </div>

                    <!-- ボタン -->
                    <button type="submit" class="btn btn-primary">送信する</button>
                </form>
            </div>
        </div>
        <!-- カードの下に置くテーブル-->
        <h2 class="h4 mt-5 mb-3">登録ユーザー一覧</h2>

        <table class="table table-hover border">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>名前</th>
                    <th>ステータス</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>山田 太郎</td>
                    <td><span class="badge bg-success">有効</span></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>佐藤 花子</td>
                    <td><span class="badge bg-secondary">停止中</span></td>
                </tr>
            </tbody>
        </table>


    </div>

    <!-- 3. Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
